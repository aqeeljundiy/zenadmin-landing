server {
  listen 80;
  root /usr/share/nginx/html;
  index itam.html;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  location = / { add_header Cache-Control "no-cache"; try_files /itam.html =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ $uri.html =404; }
  location ~* \.(css|js|woff2|webp|jpg|jpeg|png|svg)$ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(md)$ { deny all; }
}
